      - Redeem – Checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemAtCheckoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RedeemAtCheckoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RedeemAtCheckoutRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemPointsCheckResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemApplyError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemApplyNotFound'
          description: ''
  /api/v1/redeem/product/:
    post:
      operationId: redeem_product_create
      description: |-
        If a product has `redeem_points` set, the customer can 'purchase' it entirely with loyalty points. No payment is required.

        **Flow:**
        1. Check product has `redeem_points` set
        2. Validate customer has enough points
        3. Deduct points from wallet
        4. Create an order with `total_amount = 0` and `points_redeemed = N`

        Pass `warehouse` (required), optional `address_id` or `new_address`.
      summary: Redeem a product using points
      tags:
      - Redeem – Product
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRedeemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductRedeemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductRedeemRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRedeemResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRedeemError'
          description: ''
