        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Privilege Card
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPrivilegeCardList'
          description: ''
    post:
      operationId: auth_privilege_cards_create
      summary: List all privilege card registrations or create a new one
      tags:
      - Privilege Card
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivilegeCardRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PrivilegeCardRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PrivilegeCardRequest'
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivilegeCard'
          description: ''
  /api/v1/auth/privilege-cards/{id}/:
    get:
      operationId: auth_privilege_cards_retrieve
      summary: Retrieve, update or delete a privilege card registration
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Privilege Card
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivilegeCard'
          description: ''
    put:
      operationId: auth_privilege_cards_update
      summary: Retrieve, update or delete a privilege card registration
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Privilege Card
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivilegeCardRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PrivilegeCardRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PrivilegeCardRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivilegeCard'
          description: ''
    patch:
      operationId: auth_privilege_cards_partial_update
      summary: Retrieve, update or delete a privilege card registration
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Privilege Card
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPrivilegeCardRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPrivilegeCardRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPrivilegeCardRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivilegeCard'
          description: ''
    delete:
      operationId: auth_privilege_cards_destroy
      summary: Retrieve, update or delete a privilege card registration
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Privilege Card
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/warehouses/:
    post:
      operationId: warehouses_create
      summary: Create a warehouse
      tags:
      - Warehouses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WarehouseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WarehouseRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
          description: ''
    get:
      operationId: warehouses_list
      summary: List all warehouses
      parameters:
      - in: query
        name: is_active
        schema:
          type: string
        description: Filter by active status (true/false)
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Order by: warehouse_name, created_at'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search by warehouse_name or warehouse_address
      - in: query
        name: warehouse_location
        schema:
          type: string
        description: Filter by location (INDIA, UAE, UK)
      tags:
      - Warehouses
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWarehouseList'
          description: ''
  /api/v1/warehouses/{id}/:
    put:
      operationId: warehouses_update
      summary: Update a warehouse
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this warehouse.
        required: true
      tags:
      - Warehouses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WarehouseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WarehouseRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
          description: ''
    get:
      operationId: warehouses_retrieve
      summary: Get a warehouse
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this warehouse.
        required: true
      tags:
      - Warehouses
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
          description: ''
    delete:
      operationId: warehouses_destroy
      summary: Delete a warehouse
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this warehouse.
        required: true
      tags:
      - Warehouses
      responses:
        '204':
          description: No response body
    patch:
      operationId: warehouses_partial_update
      summary: Partially update a warehouse
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this warehouse.
        required: true
      tags:
      - Warehouses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWarehouseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWarehouseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWarehouseRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
          description: ''
  /api/v1/warehouses/{warehouse_id}/products/new/:
    get:
      operationId: warehouses_products_new_list
      summary: List new products in a warehouse (last 7 days)
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Filter by category UUID
      - in: query
        name: days
        schema:
          type: integer
        description: 'Number of days to look back (default: 7)'
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: sub_category
        schema:
          type: string
        description: Filter by sub-category UUID
      - in: path
        name: warehouse_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Warehouse Products
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNewProductList'
          description: ''
  /api/v1/warehouses/{warehouse_id}/products/best-sellers/:
    get:
      operationId: warehouses_products_best_sellers_list
      summary: Top 10 best-selling products in a warehouse (past 2 months)
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Filter by category UUID
      - in: query
        name: limit
        schema:
          type: integer
        description: 'Number of results (default: 10, max: 50)'
      - in: query
        name: months
        schema:
          type: integer
        description: 'Look-back period in months (default: 2)'
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: sub_category
        schema:
          type: string
        description: Filter by sub-category UUID
      - in: query
        name: type
        schema:
          type: string
        description: Filter by type (physical, digital)
      - in: path
        name: warehouse_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Warehouse Products
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBestSellerProductList'
          description: ''
  /api/v1/warehouses/{warehouse_id}/products/:
    post:
      operationId: warehouses_products_create
      description: |-
        Products scoped to a warehouse. warehouse is resolved from the URL by WarehouseScopingMiddleware.
        Product name (name_en) must be unique within the same warehouse.
      summary: Create a product in this warehouse
      parameters:
      - in: path
        name: warehouse_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Warehouse Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseScopedProductRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WarehouseScopedProductRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WarehouseScopedProductRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseScopedProduct'
          description: ''
    get:
      operationId: warehouses_products_list
      description: |-
