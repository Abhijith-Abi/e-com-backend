openapi: 3.0.3
info:
  title: House Of Vaz API
  version: 1.0.0
  description: |-
    Multi-region, multi-currency e-commerce backend API.

    ## Authentication
    Use `POST /api/v1/auth/login/` to obtain a JWT token, then pass it as:
    `Authorization: Bearer <access_token>`

    ## Pagination
    All list endpoints support `?page=1&page_size=20`.

    ## Filtering & Search
    Filter fields are listed per endpoint. Use `?search=` for text search and `?ordering=` for sorting.
paths:
  /api/v1/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      summary: Login and obtain JWT tokens
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseOfVazTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HouseOfVazTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HouseOfVazTokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      summary: Register a new customer account
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterUser'
          description: ''
  /api/v1/auth/admin-register/:
    post:
      operationId: auth_admin_register_create
      summary: Register an admin user (requires X-Admin-Secret header)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWarehouseAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateWarehouseAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateWarehouseAdminRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      summary: Login and obtain JWT tokens
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseOfVazTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HouseOfVazTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HouseOfVazTokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      summary: Get current user profile
      tags:
      - Auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
          description: ''
    patch:
      operationId: auth_profile_partial_update
      summary: Update current user profile (full_name, phone)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequestRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
          description: ''
  /api/v1/auth/create-admin/:
    post:
      operationId: auth_create_admin_create
      summary: Create a warehouse admin user (admin only)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWarehouseAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateWarehouseAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateWarehouseAdminRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWarehouseAdmin'
          description: ''
  /api/v1/auth/warehouse-admins/:
    get:
      operationId: auth_warehouse_admins_list
      summary: List all warehouse admins (admin only)
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: warehouse
        schema:
          type: string
        description: Filter by warehouse UUID
      tags:
      - Auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuthUserList'
          description: ''
  /api/v1/auth/warehouse-admins/{id}/:
    get:
      operationId: auth_warehouse_admins_retrieve
      summary: Retrieve, update or delete a warehouse admin (admin only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Auth
      responses:
        '200':
          description: No response body
    put:
      operationId: auth_warehouse_admins_update
      summary: Retrieve, update or delete a warehouse admin (admin only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWarehouseAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateWarehouseAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateWarehouseAdminRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
          description: ''
    patch:
      operationId: auth_warehouse_admins_partial_update
      summary: Retrieve, update or delete a warehouse admin (admin only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateWarehouseAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateWarehouseAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateWarehouseAdminRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
          description: ''
    delete:
      operationId: auth_warehouse_admins_destroy
      summary: Retrieve, update or delete a warehouse admin (admin only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Auth
      responses:
        '204':
          description: No response body
  /api/v1/auth/warehouse-admins/{id}/toggle-active/:
    post:
      operationId: auth_warehouse_admins_toggle_active_create
      summary: Toggle active/inactive status of a warehouse admin (admin only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
